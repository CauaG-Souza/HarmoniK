<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HarmoniK</title>
</head>
<body>
    <header>
        <h1>Login - HarmoniK</h1>
    </header>
    <main>
        <section>
            <h2>Formulário de Login</h2>
            <form action="/login" method="POST">
                <label for="email">Email:</label>
                <input type="email" 
                        id="email" 
                        name="email" 
                        required
                >

                <label for="senha">Senha:</label>
                <input type="password" 
                        id="senha" 
                        name="senha" 
                        required
                >

                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 HarmoniK. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
