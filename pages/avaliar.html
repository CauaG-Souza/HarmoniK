<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HarmoniK | Descubra novos sons</title>

    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/avaliar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="../assets/js/menu.js" defer></script>
</head>
<body>
    <header class="header">

        <a href="inicio.html" class="logo">
            Harmoni<span>K</span><span class="logo-ponto">.</span>
        </a>

        <button
            class="menu-btn"
            id="menu-btn"
            type="button"
            aria-label="Abrir menu"
            aria-controls="menu"
            aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu" id="menu">
            <a href="inicio.html" class="menu-link ">Início</a>
            <a href="musicas.html" class="menu-link">Explorar</a>
            <a href="avaliar.html" class="menu-link menu-link-ativo" >Avaliações</a>
            <a href="perfil.html" class="menu-link">Perfil</a>
            <a href="cadastro-musica.html" class="menu-link menu-link-destaque">
                + Cadastrar música
            </a>
            <a href="../index.html" class="menu-link menu-link-sair">
                Sair
            </a>
        </nav>
    </header>
    <main class="main">

        <section class="secao-avaliacao">
            <h1>Avaliar item</h1>
            <p class="subtitulo">Chegou a hora de avaliar algo!</p>

            <form action="avaliar.html" method="post" class="form-avaliacao">

                <div class="campo">
                    <label for="tipo">O que está avaliando?</label>
                    <select id="tipo" name="tipo">
                        <option value="album">Álbum</option>
                        <option value="musica">Música</option>
                        <option value="artista">Artista</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="qual">Qual?</label>
                    <select id="qual" name="qual">
                        <option value="album1">Álbum 1</option>
                        <option value="musica2">Música 2</option>
                        <option value="artista3">Artista 3</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="avaliacao">Avaliação</label>
                    <select id="avaliacao" name="avaliacao">
                        <option value="0">☆☆☆☆☆</option>
                        <option value="1">★☆☆☆☆</option>
                        <option value="2">★★☆☆☆</option>
                        <option value="3">★★★☆☆</option>
                        <option value="4">★★★★☆</option>
                        <option value="5">★★★★★</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="comentario">Comentário</label>
                    <textarea id="comentario" name="comentario" rows="4" placeholder="Deixe sua opinião..."></textarea>
                </div>

                <button type="submit" class="botao">Enviar avaliação</button>

            </form>
        </section>

    </main>
    <footer class="footer">
        <a class="logo logo-footer">
            Harmoni<span>K</span><span class="logo-ponto">.</span>
        </a>

        <p>Feito para quem sente a música. © 2026 HarmoniK.</p>

        <a href="#topo" class="footer-voltar"
           onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">
            Voltar ao topo ↑
        </a>
    </footer>
</body>
</html>
