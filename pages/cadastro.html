<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - HarmoniK</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="../assets/js/menu.js" defer></script>
</head>
<body>
    <header class="header">

        <a href="../index.html" class="logo">
            Harmoni<span>K</span><span class="logo-ponto">.</span>
        </a>

        <button
            class="menu-btn"
            id="menu-btn"
            type="button"
            aria-label="Abrir menu"
            aria-controls="menu"
            aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu" id="menu">
            <a href="cadastro.html" class="menu-link menu-link-ativo">Cadastro</a>
            <a href="login.html" class="menu-link">Login</a>
        </nav>

    </header>
    <main class ="main">
        <section class="info-container">
            <div class="form-head">
                <h2>Formulário de Cadastro</h2>
            </div>
            <div class="form-main">
                <form class ="cadastro" action="inicio.html" method="get">
                    <label for="nome">Nome de usuário:</label>
                    <input type="text" 
                            id="nome" 
                            name="nome" 
                            required
                    >

                    <label for="email">Email:</label>
                    <input type="email" 
                            id="email" 
                            name="email" 
                            required
                    >

                    <label for="senha">Senha:</label>
                    <input type="password" 
                            id="senha" 
                            name="senha" 
                            required
                    >

                    <button type="submit">Cadastrar</button>
                </div>
            </form>
        </section>
    </main>
    <footer class="footer">
        <a class="logo logo-footer">
            Harmoni<span>K</span><span class="logo-ponto">.</span>
        </a>

        <p>Feito para quem sente a música. © 2026 HarmoniK.</p>

        <a href="#topo" class="footer-voltar"
           onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">
            Voltar ao topo ↑
        </a>
    </footer>
</body>
</html>
