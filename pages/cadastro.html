<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - HarmoniK</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class ="text-container">
        <h1>HarmoniK</h1>
        <p>Cadastrar novo usuário.</p>
        </div>
        <nav class="menu">
                <a class="btn-animado" href="../index.html">Início</a>
                <a class="btn-animado" href="login.html">Login</a>
            </ul>
        </nav>
    </header>
    <main class ="main">
        <section class="info-container">
            <div class="form-head">
                <h2>Formulário de Cadastro</h2>
            </div>
            <div class="form-main">
                <form class ="cadastro" action="inicio.html" method="get">
                    <label for="nome">Nome de usuário:</label>
                    <input type="text" 
                            id="nome" 
                            name="nome" 
                            required
                    >

                    <label for="email">Email:</label>
                    <input type="email" 
                            id="email" 
                            name="email" 
                            required
                    >

                    <label for="senha">Senha:</label>
                    <input type="password" 
                            id="senha" 
                            name="senha" 
                            required
                    >

                    <button type="submit">Cadastrar</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 HarmoniK. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
